    <!-- Brand typography: Omnes and Canvas Script, served by Adobe Fonts. -->
    <!--
      O kit da Adobe vem com font-display:auto, que esconde o texto até a fonte chegar (segundos no 4G).
      Lemos o CSS do kit e aplicamos com font-display:swap: o texto aparece na hora na fonte reserva e
      troca quando a fonte chega. O @import de p.typekit.net (contagem de licença) segue no CSS.
      Se o fetch falhar, cai no <link> normal. As fontes (~1 MB) só começam a baixar depois da primeira
      pintura, para não disputarem banda com o JavaScript e a foto do topo.
    -->
    <link rel="preconnect" href="https://use.typekit.net" crossorigin />
    <link rel="preconnect" href="https://p.typekit.net" crossorigin />
    <script>
      (function () {
        var href = "https://use.typekit.net/zxu4fzi.css";
        function plainLink() {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        }
        if (!window.fetch) return plainLink();

        var painted = new Promise(function (resolve) {
          setTimeout(resolve, 3000);
          try {
            new PerformanceObserver(function (list) {
              if (list.getEntriesByName("first-contentful-paint").length) resolve();
            }).observe({ type: "paint", buffered: true });
          } catch (e) {
            resolve();
          }
        });

        var css = fetch(href).then(function (res) {
          if (!res.ok) throw new Error(res.status);
          return res.text();
        });

        Promise.all([css, painted])
          .then(function (results) {
            var style = document.createElement("style");
            style.textContent = results[0].replace(/font-display:\s*auto/g, "font-display:swap");
            document.head.appendChild(style);
          })
          .catch(plainLink);
      })();
    </script>
